name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Renovate PRs (lockfile-only bumps from renovate/* branches) are
    # reviewed and verified manually before being applied — see #99/#101.
    # github.head_ref is empty on push events, so main pushes still run.
    if: ${{ !startsWith(github.head_ref, 'renovate/') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        # rustfmt is a dc-ui build dependency (#246/#271); the runner
        # images happen to preinstall it — don't rely on that.
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install software Vulkan driver (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo build --workspace --locked
      # The software-rendered kittest suites segfault intermittently on
      # hosted runners (two PR-#299 runs died with SIGSEGV mid-binary on
      # ubuntu-latest — different binaries, no libtest failure summary —
      # and both passed on rerun). Retry the suite: one green attempt
      # passes the job, three red attempts still fail it.
      - name: cargo test (retry — hosted-runner rendering flakes)
        shell: bash
        run: |
          for i in 1 2 3; do
            cargo test --workspace --locked && exit 0
            echo "::warning::test attempt $i failed; retrying"
          done
          exit 1

  file-sizes:
    # #364: the file-size guard — a warning-only measuring stick for the
    # decomposition effort: files over the 1,500-line cap are reported
    # (as PR annotations) but stay green until the backlog drains; the
    # flip to a hard gate is FILE_SIZE_ENFORCE=1 on the script run here.
    if: ${{ !startsWith(github.head_ref, 'renovate/') }}
    runs-on: ubuntu-latest
    permissions:
      # Job-scoped on purpose (contents: read is what checkout needs;
      # issues: write is the #366 sticky PR comment) — never workflow-wide.
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/file_size_guard.sh
        env:
          FILE_SIZE_REPORT: size-report.md
      # #366: mirror the report as a sticky conversation comment — the
      # bot's previous comment (matched by the marker inside the body)
      # is UPDATED, not re-posted, so pushes edit one living table
      # instead of spamming the thread. Warning-only all the way down:
      # a comment failure is core.warning, never a red job.
      - if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- file-size-guard:sticky -->';
            let body;
            try {
              body = fs.readFileSync('size-report.md', 'utf8');
            } catch (e) {
              core.warning('size-report.md missing — skipping the PR comment');
              return;
            }
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              const prior = comments.find(
                (c) => c.user.type === 'Bot' && (c.body || '').includes(marker)
              );
              if (prior) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: prior.id,
                  body,
                });
                core.info('updated the sticky file-size comment');
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
                core.info('created the sticky file-size comment');
              }
            } catch (e) {
              core.warning(`file-size PR comment failed (warning-only): ${e.message}`);
            }
