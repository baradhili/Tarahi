name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      linux_only:
        description: "Run only the linux jobs (glibc-floor verification)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  linux:
    # glibc floor (#261, supersedes the #98 24.04 floor): the AppImage
    # is catalog-tested on the OLDEST still-supported Ubuntu LTS, so
    # the whole linux job builds inside an ubuntu:22.04 container
    # (glibc 2.35) — the AppImage/deb/rpm then run on 22.04 and
    # everything newer. The 22.04 base also avoids the newer-image
    # trap that motivated #98 (the ubuntu-26.04 image's glibc 2.43
    # made every linked binary refuse to start on older distros); do
    # not move this back to a bare runner — the glibc-floor step below
    # fails the build if the base ever drifts above the floor.
    #
    # Two legs (#296): x86_64 and aarch64. Each leg runs the SAME
    # ubuntu:22.04 container NATIVELY on its own runner (the
    # ubuntu-24.04-arm hosted runner is free for public repos) — the
    # multi-arch ubuntu image pulls the matching variant — so both
    # artifacts share the glibc 2.35 floor with no cross toolchain,
    # sysroot, or arch-specific build steps to maintain. The app is
    # pure Rust (harfrust/usvg/zbus, system libraries only dlopen'd),
    # so a native build per arch is all the portability that exists.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            rpm_arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            rpm_arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:22.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          # file — appimagetool's 2026-11 continuous build requires it (#274)
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git file build-essential binutils zsync \
            libxkbcommon-x11-0 libxkbcommon0 libx11-6 libx11-xcb1 libxcb1 libxcb-xkb1 \
            libxcursor1 libxrandr2 libxi6 libxrender1 libxfixes3 libxext6 \
            libxau6 libxdmcp6 libbsd0 libmd0 libwayland-client0 \
            libwayland-cursor0 libwayland-egl1 libffi8 libdbus-1-3
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        # #271: this container has no preinstalled Rust for the rustup
        # proxy to fall back to, and the action installs the minimal
        # profile — no rustfmt. dc-ui's fluent-typed build script
        # (since #246) pipes its generated code through rustfmt, so it
        # is a hard build dependency.
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked
      - name: Build release binary
        run: cargo build --release -p dc-ui --locked
      - name: Enforce glibc floor
        env:
          # Newest glibc symbol version the shipped binary may require.
          # 2.35 = Ubuntu 22.04 (the oldest still-supported LTS — the
          # AppImage catalog test system). Raise only with an explicit
          # compat decision; to support OLDER distros, build with an
          # older-baseline linker (e.g. cargo-zigbuild) instead.
          GLIBC_FLOOR: "2.35"
        run: |
          BIN=target/release/tarahi
          MAXV="$(objdump -T "$BIN" | grep -o 'GLIBC_[0-9][0-9.]*' | sort -uV | tail -1)"
          MAXN="${MAXV#GLIBC_}"
          echo "highest GLIBC symbol version required: ${MAXV:-none}"
          if [ -n "$MAXN" ] && [ "$(printf '%s\n' "$GLIBC_FLOOR" "$MAXN" | sort -V | tail -1)" != "$GLIBC_FLOOR" ]; then
            echo "::error::binary requires $MAXV, above the release floor $GLIBC_FLOOR — the build environment linked against a newer glibc than the supported baseline (#98)"
            echo "symbols requiring the newest versions:"
            objdump -T "$BIN" | grep -F "($MAXV)" | head -10
            exit 1
          fi
      - name: Version
        id: ver
        run: |
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in [0-9]*) ;; *) VER="0.1.0" ;; esac
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: deb
        # The workspace version stays 0.1.0; the package carries the
        # release version, which dpkg and the ArtCraft Launcher read.
        run: cargo deb -p dc-ui --no-build --deb-version "${{ steps.ver.outputs.version }}"
      - name: rpm
        working-directory: crates/dc-ui
        run: |
          cargo generate-rpm --set-metadata "version = \"${{ steps.ver.outputs.version }}\""
          mv target/generate-rpm/*.rpm "${GITHUB_WORKSPACE}/Tarahi_${{ steps.ver.outputs.version }}_${{ matrix.rpm_arch }}.rpm"
      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          # Current linuxdeploy: its embedded AppImage runtime is what
          # the catalog test flagged as outdated with the 2024-01 pin.
          # The aarch64 continuous build embeds the matching aarch64
          # AppImage runtime, so each leg bundles its own architecture.
          # curl, not wget — the bare 22.04 container installs curl
          # above but ships neither downloader by default (PR #269
          # review).
          curl -fsSL https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.arch }}.AppImage -o /tmp/linuxdeploy
          chmod +x /tmp/linuxdeploy
          mkdir -p AppDir/usr/lib
          # winit/rfd/arboard dlopen the X11/Wayland client libraries,
          # and rfd's portal file dialogs dlopen libdbus — linuxdeploy
          # bundles only NEEDED-linked deps, so the dlopen set (with
          # its transitive closure) is copied in explicitly (#261: the
          # catalog test system has none of them and the app must work
          # offline on a bare desktop).
          #
          # EXCEPTION (#292): the libwayland client libraries are
          # deliberately NOT bundled. They must match the host's Mesa
          # EGL driver, which is always loaded from the host — the
          # 22.04 copy (libwayland 1.20) shadows the host's newer one,
          # and the driver's wl_display_create_queue_with_name (1.22+)
          # then fails to resolve, crashing at startup on any Wayland
          # session with current Mesa (0.2.12–0.2.15). Every
          # Wayland-session host ships them (a Wayland session cannot
          # exist without libwayland-client); on a bare X11 desktop
          # winit's dlopen simply fails and it falls back to X11. 0.2.11
          # (pre-#261) shipped none and ran fine under Wayland.
          for lib in \
            libX11.so.6 libX11-xcb.so.1 libxcb.so.1 libXau.so.6 libXdmcp.so.6 \
            libxkbcommon.so.0 libxkbcommon-x11.so.0 \
            libXcursor.so.1 libXrandr.so.2 libXi.so.6 libXrender.so.1 \
            libXfixes.so.3 libXext.so.6 libxcb-xkb.so.1 libbsd.so.0 \
            libmd.so.0 \
            libdbus-1.so.3 libsystemd.so.0 liblzma.so.5 libzstd.so.1 \
            liblz4.so.1 libcap.so.2 libgcrypt.so.20 libgpg-error.so.0 \
            libffi.so.8; do
            src="$(ldconfig -p | awk -v lib="$lib" '$NF ~ ("/" lib "$") {print $NF; exit}')"
            if [ -z "$src" ]; then
              echo "::warning::runtime library $lib not found in the build container"
            else
              cp -aL "$src" AppDir/usr/lib/
            fi
          done
          # Guard against re-introducing #292: a bundled libwayland-client
          # shadows the host's and breaks the host's EGL driver.
          test ! -e AppDir/usr/lib/libwayland-client.so.0 || {
            echo "::error::libwayland-client.so.0 got bundled — it shadows the host's libwayland and breaks the host Mesa EGL driver (#292)"
            exit 1
          }
          # Third-party license files ride in the image (PR #299
          # review: the hunspell dictionaries' notices require the
          # license to accompany the shipped binaries).
          bash packaging/collect-licenses.sh AppDir/usr/share/doc/tarahi
          # The AppImage FILE name must match the desktop entry's
          # application name (Name=Tarahi) — the catalog test rejects
          # diagramcraft_*.AppImage for it (#261).
          #
          # Update information (#281): linuxdeploy forwards
          # UPDATE_INFORMATION to appimagetool, which embeds the
          # AppImageUpdate metadata AND emits the matching .zsync next
          # to the AppImage (shipped by Collect artifacts below). The
          # pattern's last field globs the ZSYNC SIDECAR's name on the
          # release (the AppImage spec's example ends .AppImage.zsync)
          # — a pattern ending at .AppImage would name the binary and
          # AppImageUpdate would never find the sidecar (PR review on
          # #281). `latest` resolves against the latest NON-prerelease
          # GitHub release — if a release ever ships marked
          # prerelease, AppImageUpdate would keep resolving the
          # previous stable one (channel decision to revisit then,
          # per the #281 caveat).
          UPDATE_INFORMATION="gh-releases-zsync|baradhili|Tarahi|latest|Tarahi_*_${{ matrix.arch }}.AppImage.zsync" \
          OUTPUT="Tarahi_${{ steps.ver.outputs.version }}_${{ matrix.arch }}.AppImage" /tmp/linuxdeploy \
            --appdir AppDir \
            -e target/release/tarahi \
            -d packaging/tarahi.desktop \
            -i packaging/tarahi.png \
            --output appimage
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/
          cp Tarahi_*_${{ matrix.rpm_arch }}.rpm dist/
          cp Tarahi_*_${{ matrix.arch }}.AppImage dist/
          # The zsync sidecar (#281): AppImageUpdate deltas download
          # through it; without it the embedded update information
          # points at nothing. appimagetool only WARNS when zsyncmake
          # is missing (zsync is in the tool list above), so an absent
          # sidecar must fail here with a clear message, not a bare
          # cp glob error (PR review on #281).
          test -s Tarahi_*_${{ matrix.arch }}.AppImage.zsync || {
            echo "::error::the AppImage step produced no .zsync sidecar — update information is embedded but AppImageUpdate has nothing to download"
            exit 1
          }
          cp Tarahi_*_${{ matrix.arch }}.AppImage.zsync dist/
          ls -la dist/
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  windows:
    if: ${{ !inputs.linux_only }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        # rustfmt is a dc-ui build dependency (#246/#271); the runner
        # images happen to preinstall it — don't rely on that.
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install NSIS
        run: choco install nsis -y
      - name: Version
        id: ver
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in [0-9]*) ;; *) VER="0.1.0" ;; esac
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Build binary
        env:
          # build.rs writes it into tarahi.exe's version resource.
          TARAHI_VERSION: ${{ steps.ver.outputs.version }}
        run: cargo build --release -p dc-ui --locked
      - name: Stage third-party license files
        shell: bash
        run: |
          # The installer and the portable zip both install these (PR
          # #299 review: the dictionaries' notices require the license
          # to accompany the shipped binaries).
          bash packaging/collect-licenses.sh licenses-third-party
      - name: Build installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\NSIS\makensis.exe" -DVERSION=${{ steps.ver.outputs.version }} -DBINDIR="%GITHUB_WORKSPACE%\target\release" -DLICENSEDIR="%GITHUB_WORKSPACE%" packaging\installer.nsi
      - name: Portable zip
        shell: bash
        run: |
          mkdir -p dist
          7z a -tzip "dist/Tarahi_${{ steps.ver.outputs.version }}_windows_x64.zip" ./target/release/tarahi.exe
          7z a -tzip "dist/Tarahi_${{ steps.ver.outputs.version }}_windows_x64.zip" ./licenses-third-party
      - name: Collect artifacts
        shell: bash
        run: |
          # NSIS writes OutFile relative to the script directory.
          cp packaging/Tarahi_*_setup.exe dist/
          ls -la dist/
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  macos:
    if: ${{ !inputs.linux_only }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        # rustfmt: see the windows job note (#246/#271).
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Version
        id: ver
        run: |
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in [0-9]*) ;; *) VER="0.1.0" ;; esac
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Build universal binary
        run: |
          cargo build --release -p dc-ui --locked --target x86_64-apple-darwin
          cargo build --release -p dc-ui --locked --target aarch64-apple-darwin
          mkdir -p "Tarahi.app/Contents/MacOS" "Tarahi.app/Contents/Resources"
          lipo -create \
            target/x86_64-apple-darwin/release/tarahi \
            target/aarch64-apple-darwin/release/tarahi \
            -output "Tarahi.app/Contents/MacOS/Tarahi"
      - name: Bundle icon
        run: |
          mkdir AppIcon.iconset
          for size in 16 32 128 256; do
            sips -z $size $size packaging/tarahi.png --out AppIcon.iconset/icon_${size}x${size}.png >/dev/null
            big=$((size * 2))
            sips -z $big $big packaging/tarahi.png --out AppIcon.iconset/icon_${size}x${size}@2x.png >/dev/null
          done
          iconutil -c icns AppIcon.iconset -o "Tarahi.app/Contents/Resources/AppIcon.icns"
      - name: Bundle app + dmg
        run: |
          cp packaging/Info.plist "Tarahi.app/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "${{ steps.ver.outputs.version }}" "Tarahi.app/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "${{ steps.ver.outputs.version }}" "Tarahi.app/Contents/Info.plist"
          # Every vendored asset's license rides in the bundle (PR
          # #299 review; packaging/collect-licenses.sh keeps the set
          # identical to the other formats).
          bash packaging/collect-licenses.sh "Tarahi.app/Contents/Resources/licenses"
          codesign --force --sign - --deep "Tarahi.app"
          mkdir -p dist
          hdiutil create -volname "Tarahi" \
            -srcfolder "Tarahi.app" -ov -format UDZO \
            "dist/Tarahi_${{ steps.ver.outputs.version }}_universal.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Launcher asset names and SHA256SUMS.txt
        # The ArtCraft Launcher (storytold/craft-launcher, #372) picks a
        # release asset named <app>-<version>-<os>-<arch>[-portable].<ext>
        # and verifies every download against the release's
        # SHA256SUMS.txt. Copies under those names sit next to the
        # existing files, whose names the AppImage update information
        # (Tarahi_*_<arch>.AppImage.zsync) and earlier links rely on; the
        # checksums cover every asset.
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          cd dist
          copy() {
            if [ ! -f "$1" ]; then
              echo "::error::launcher copy: missing $1"
              exit 1
            fi
            cp -- "$1" "$2"
          }
          for arch in x86_64 aarch64; do
            copy "Tarahi_${v}_${arch}.AppImage" "tarahi-${v}-linux-${arch}.AppImage"
          done
          for pair in amd64:x86_64 arm64:aarch64; do
            copy "Tarahi_${v}_${pair%%:*}.rpm" "tarahi-${v}-linux-${pair##*:}.rpm"
            # cargo-deb names the package from the crate metadata, so
            # match it by architecture only.
            deb=$(find . -maxdepth 1 -name "*_${pair%%:*}.deb" | head -n 1)
            copy "${deb:-no deb for ${pair%%:*}}" "tarahi-${v}-linux-${pair##*:}.deb"
          done
          copy "Tarahi_${v}_windows_x64.zip" "tarahi-${v}-windows-x64-portable.zip"
          copy "Tarahi_${v}_universal.dmg" "tarahi-${v}-macos-universal.dmg"
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Prerelease?
        id: pre
        run: |
          # vMAJOR.MINOR.PATCH.<letter> tags (v0.1.0.a, v0.1.0.b, …) are
          # CI-iteration prereleases; plain semver tags publish full
          # releases.
          case "$GITHUB_REF_NAME" in
            v*.*.*.*) echo "pre=true" >> "$GITHUB_OUTPUT" ;;
            *)        echo "pre=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ steps.pre.outputs.pre }}
